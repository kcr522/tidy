# 안드로이드 앱(APK) 만들기
# GitHub의 Actions 탭 → "Android APK" → 맨 위 실행 결과 → 아래쪽 Artifacts의 tidy-debug-apk 를 받으면 된다.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**', 'preview/**', 'claude/**']
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest 에는 Android SDK가 이미 깔려 있다 ($ANDROID_HOME)
      - name: Android SDK 확인
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 웹 화면 빌드
        run: |
          npm ci
          npm run build

      - name: 안드로이드 프로젝트에 복사
        run: npx cap sync android

      - name: APK 만들기
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          TIDY_BUILD_NUMBER: ${{ github.run_number }}

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk tidy-debug.apk && cp tidy-debug.apk tidy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tidy-debug-apk
          path: tidy-debug.apk
          retention-days: 30

      # 폰에서 바로 받을 수 있게 "Releases"에도 올린다 (main 이나 preview/all-features 에서 만들 때만, 항상 같은 주소: releases/latest)
      - name: 릴리스에 올리기
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview/all-features'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tidy 1.0.${{ github.run_number }}
          # 앱 안 업데이트 창의 "바뀐 점"에 커밋 메시지(합친 PR 제목)가 보인다 (src/lib/appUpdate.ts 의 releaseNotes)
          body: |
            ${{ github.event.head_commit.message }}

            폰에서 이 파일(tidy.apk)을 받아 설치하면 이전 기록은 그대로 두고 업데이트돼요.
          files: tidy.apk
          make_latest: true
