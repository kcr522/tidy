# 컴퓨터 바탕화면용 'Tidy 달력' 위젯 앱 (desktop-widget/, Tauri) 만들기: 맥(.dmg)과 윈도우(.exe)
# main · preview/all-features 에서 만들면 Releases 의 desktop-widget-latest 에 올린다 (설정 > 홈 화면 위젯 > 달력의 '위젯 앱 받기')
# 폰 앱 업데이트(releases/latest)와 섞이지 않게 make_latest 는 끈다
name: Desktop widget

on:
  workflow_dispatch:
  push:
    branches: [main, 'preview/**', 'claude/**']
    paths: ['desktop-widget/**', '.github/workflows/desktop-widget.yml']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            file: Tidy-Calendar-mac.dmg
          - os: windows-latest
            args: ''
            file: Tidy-Calendar-windows.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-widget

      - name: 위젯 앱 만들기
        working-directory: desktop-widget
        run: npx -y @tauri-apps/cli@2 build ${{ matrix.args }}

      - name: 파일 이름 정리
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp desktop-widget/target/universal-apple-darwin/release/bundle/dmg/*.dmg "${{ matrix.file }}"
          else
            cp desktop-widget/target/release/bundle/nsis/*-setup.exe "${{ matrix.file }}"
          fi
          ls -la "${{ matrix.file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}
          retention-days: 30

      - name: 릴리스에 올리기
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview/all-features'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-widget-latest
          name: Tidy 달력 위젯 (맥 · 윈도우)
          body: |
            컴퓨터 바탕화면에 Tidy 달력을 띄우는 위젯 앱이에요. 바탕 투명도를 고를 수 있어요.
            - 맥: Tidy-Calendar-mac.dmg → 'Tidy 달력'을 응용 프로그램 폴더로. 처음 열 때 시스템 설정 → 개인정보 보호 및 보안 → '그래도 열기'
            - 윈도우(삼성 노트북): Tidy-Calendar-windows.exe 실행. 'Windows의 PC 보호'가 나오면 '추가 정보' → '실행'
          files: ${{ matrix.file }}
          make_latest: false
