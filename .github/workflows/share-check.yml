# 임시: 에뮬레이터에서 공유 창에 Tidy 가 뜨는지 찍어 본다 (PR 전에 지운다)
name: Share check
on:
  push:
    branches: [claude/project-thread-lh5sx1]
    paths-ignore: ['docs/**']
permissions:
  contents: write
jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 빌드
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          npm ci
          npm run build
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
      - name: 에뮬레이터
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/share-check.sh
      - name: 사진 올리기
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f docs/screenshots/x-share-ci
          git commit -m "공유 창 확인 사진 (에뮬레이터)" || exit 0
          git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
