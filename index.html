<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f4f6" />
    <meta name="description" content="가계부 · 할 일 · 스크랩을 하나로 정리하는 앱" />
    <title>Tidy</title>
    <script>
      // 첫 화면이 하얗게 번쩍이지 않도록, 저장된 화면 밝기를 그리기 전에 적용 (src/lib/colorMode.ts 와 같은 규칙)
      try {
        var m = localStorage.getItem('tidy-color-mode') || 'auto'
        if (m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
